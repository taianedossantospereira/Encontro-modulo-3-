<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Editar tarefa">
    <title>Editar Tarefa - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="app-body">
    <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>
    <div class="app-layout">
        <aside class="sidebar" aria-label="Navegação lateral">
            <header class="sidebar-header"><h1>Dashboard</h1></header>
            <nav class="sidebar-nav" aria-label="Menu principal">
                <ul>
                    <li><a href="dashboard.html">Minhas Tarefas</a></li>
                    <li><a href="nova-tarefa.html">Criar Tarefa</a></li>
                    <li><a href="dashboard.html">Configurações</a></li>
                    <li><a href="../index.html">Sair</a></li>
                </ul>
            </nav>
            <p class="sidebar-footer">© 2026 Projeto Acadêmico</p>
        </aside>
        <main id="main-content" class="dashboard-content">
            <header class="dashboard-header">
                <h2>Editar Tarefa</h2>
                <a href="dashboard.html" class="btn btn-primary btn-back">Voltar</a>
            </header>
            <section class="card task-form-card">
                <form id="tarefa-form" data-mode="edit" novalidate>
                    <div class="form-group">
                        <label for="titulo">Título</label>
                        <input id="titulo" name="titulo" type="text" required>
                    </div>
                    <div class="form-group">
                        <label for="descricao">Descrição</label>
                        <textarea id="descricao" name="descricao" rows="6"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success">Salvar Alterações</button>
                </form>
            </section>
        </main>
    </div>
    <script src="../js/app.js"></script>
</body>
</html>

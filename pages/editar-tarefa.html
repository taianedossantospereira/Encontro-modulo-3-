<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Edição de tarefa">
  <title>Editar Tarefa - Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body class="app-body">
  <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>
  <div class="app-layout">
    <aside class="sidebar" aria-label="Navegação lateral">
      <header class="sidebar-header"><h1>Dashboard</h1></header>
      <nav class="sidebar-nav" aria-label="Menu principal"><ul>
        <li><a href="dashboard.html">Minhas Tarefas</a></li>
        <li><a href="nova-tarefa.html">Criar Tarefa</a></li>
        <li><a href="../index.html">Sair</a></li>
      </ul></nav>
      <p class="sidebar-footer">© 2026 Projeto Acadêmico</p>
    </aside>
    <main id="main-content" class="dashboard-content detail-content">
      <header class="dashboard-header">
        <h2>Editar Tarefa</h2>
        <a href="dashboard.html" class="btn btn-primary btn-back">Voltar para a Lista</a>
      </header>
      <section class="detail-card" aria-labelledby="form-title">
        <h3 id="form-title">Alterar dados da tarefa</h3>
        <form action="dashboard.html" method="get">
          <div class="form-group">
            <label for="titulo">Título da tarefa</label>
            <input id="titulo" name="titulo" type="text" value="Revisar proposta do cliente" required>
          </div>
          <div class="form-group">
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" rows="6" required>Verificar os valores e o escopo do projeto antes de enviar para o cliente.</textarea>
          </div>
          <div class="form-group">
            <label for="status">Status</label>
            <select id="status" name="status">
              <option value="pendente" selected>Pendente</option>
              <option value="concluida">Concluída</option>
            </select>
          </div>
          <div class="detail-actions">
            <a href="dashboard.html" class="btn btn-danger">Cancelar</a>
            <button type="submit" class="btn btn-success">Salvar Alterações</button>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>

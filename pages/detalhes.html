<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Detalhes de uma tarefa do sistema">
    <title>Detalhes da Tarefa</title>
    <link rel="stylesheet" href="../css/estilos.css">
</head>

<body class="app-body">
    <a href="#main-content" class="skip-link">Pular para o conteúdo principal</a>

    <div class="app-layout">
        <aside class="sidebar" aria-label="Navegação lateral">
            <header class="sidebar-header">
                <h1>Dashboard</h1>
            </header>

            <nav class="sidebar-nav" aria-label="Menu principal">
                <ul>
                    <li><a href="dashboard.html">Minhas Tarefas</a></li>
                    <li><a href="nova-tarefa.html">Criar Tarefa</a></li>
                    <li><a href="dashboard.html">Configurações</a></li>
                    <li><a href="../index.html">Sair</a></li>
                </ul>
            </nav>

            <p class="sidebar-footer">© 2026 Projeto Acadêmico</p>
        </aside>

        <main id="main-content" class="dashboard-content detail-content">
            <header class="dashboard-header">
                <h2>Detalhes da Tarefa</h2>
                <a href="dashboard.html" class="btn btn-primary btn-back">Voltar para a Lista</a>
            </header>

            <article id="task-detail" class="detail-card">
                <header>
                    <h3 data-field="title">Tarefa</h3>
                    <p class="status-line">Status: <strong data-field="status">Pendente</strong></p>
                </header>

                <dl class="detail-info">
                    <div>
                        <dt>Criada em:</dt>
                        <dd data-field="created">-</dd>
                    </div>
                    <div>
                        <dt>Descrição:</dt>
                        <dd data-field="description">Sem descrição.</dd>
                    </div>
                </dl>

                <footer class="detail-actions">
                    <a href="editar-tarefa.html" data-action="edit" class="btn btn-primary">Editar Tarefa</a>
                    <button type="button" data-action="delete" class="btn btn-danger">Excluir Tarefa</button>
                </footer>
            </article>
        </main>
    </div>

    <script src="../js/app.js"></script>
</body>
</html>
